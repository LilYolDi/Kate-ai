<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Катя AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header>
      <div class="avatar">К</div>
      <div>
        <h2>Катя AI</h2>
        <span>Твоя виртуальная собеседница</span>
      </div>
      <div class="status">● Онлайн</div>
    </header>

    <main id="chat">
      <div class="message katya">
        Привет! ❤️ Я Катя. О чём поговорим?
      </div>
    </main>

    <div class="controls">
      <button id="voice" title="Голосовой ввод">🎤</button>
      <input
        id="message"
        type="text"
        placeholder="Напиши Кате..."
        autocomplete="off"
      >
      <button id="send">➤</button>
    </div>

    <footer>Катя AI · Искусственный интеллект</footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
