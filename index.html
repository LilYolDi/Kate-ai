
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Катя AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app voice-screen">

    <header class="top-bar">
      <button class="round-button" id="menuButton" aria-label="Меню">
        <span class="menu-icon">☰</span>
      </button>

      <div class="top-title">
        <strong>Катя AI</strong>
        <span>Голосовой режим</span>
      </div>

      <button class="round-button" id="settingsButton" aria-label="Настройки">
        <span class="settings-icon">☷</span>
      </button>
    </header>

    <main class="voice-main">

      <div class="orb-container">
        <div class="orb" id="katyaOrb"></div>
      </div>

      <div id="chat" class="chat-messages">
        <div class="message katya">
          Привет! ❤️ Я Катя. О чём поговорим?
        </div>
      </div>

    </main>

    <div class="bottom-controls">

      <div class="message-input">
        <button id="addButton" class="add-button" aria-label="Дополнительно">
          +
        </button>

        <input
          id="message"
          type="text"
          placeholder="Спросить Катю..."
          autocomplete="off"
        >

        <button id="send" class="send-button" aria-label="Отправить">
          ➤
        </button>
      </div>

      <button
  id="voice"
  class="round-button mic-button"
  title="Голосовой ввод"
  aria-label="Включить микрофон"
>
  <span class="mic-glass">
    <svg viewBox="0 0 48 48" class="mic-svg">
      <rect x="18" y="5" width="12" height="23" rx="6"/>
      <path d="M12 22v2a12 12 0 0 0 24 0v-2"/>
      <path d="M24 36v7M17 43h14"/>
    </svg>
  </span>
</button>

      <button
        id="voiceExit"
        class="round-button exit-button"
        aria-label="Выйти из голосового режима"
      >
        ×
      </button>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
